# ค่าตำแหน่งสำหรับ YouTube Shorts (1080x1920)
canvas: { width: 1080, height: 1920 }
unsafe:
  top_percent: 10
  bottom_percent: 25      # ชื่อช่อง/title/ปุ่ม Shorts
  right_percent: 15       # ปุ่มไลก์ คอมเมนต์ แชร์
subject_zone: "กลาง 60% ของเฟรม"
subtitle_zone: "กึ่งกลางจอแนวนอน (X=540) ค่อนลงมาที่ Y=1200"
subtitle_pos_x: 540       # กึ่งกลางแนวนอนเป๊ะ (1080 / 2)
subtitle_pos_y: 1200      # กึ่งกลางค่อนล่าง อยู่เหนือ UI ด้านล่างและไม่บังหน้าตัวละคร
subtitle_margin_v: 680
subtitle_margin_l: 100    # ซ้าย-ขวาเท่ากันเพื่อให้จัดกึ่งกลางเป๊ะ
subtitle_margin_r: 100
